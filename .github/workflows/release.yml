name: Release APK

# Phase 4 (스펙 §10): tag push → test → build → sign → sha256 → GitHub Release
# 필수 시크릿: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# 선택 시크릿: MAPS_API_KEY (없으면 지도 화면이 안내 문구로 대체된다)
# 릴리즈 저장소(D2)에서 이 워크플로우를 실행하거나, APP_REPO를 앱 저장소로 둔다.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      minimum_version:
        description: "update-config.json minimumVersion (비우면 0.0.0)"
        required: false
        default: ""
      mandatory:
        description: "필수 업데이트 여부"
        type: boolean
        default: false

permissions:
  contents: write

env:
  APK_NAME: realmatjip-universal.apk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 1) 백엔드 단위 테스트 (API 키 불필요한 순수 테스트만 — 시크릿 없음)
      - name: Backend unit tests
        working-directory: backend
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m unittest discover -s tests -t . -q

      # 2) Android 단위 테스트
      - name: Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      # 3) 서명 키 복원 (CI 시크릿 → 파일)
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > $HOME/release.keystore
          echo "KEYSTORE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"

      # 4) 서명 릴리즈 빌드
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 없으면 지도 화면이 "API 키가 필요합니다" 안내로 대체된다(빌드는 성공).
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      # 5) 자산 준비 — universal APK + sha256 + update-config.json (머신리더블)
      - name: Prepare release assets
        env:
          MINIMUM_VERSION: ${{ github.event.inputs.minimum_version }}
          MANDATORY: ${{ github.event.inputs.mandatory }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"

          TAG="${GITHUB_REF_NAME}"
          MIN="${MINIMUM_VERSION:-0.0.0}"
          [ "$MANDATORY" = "true" ] && M="true" || M="false"
          cat > update-config.json <<EOF
          {
            "minimumVersion": "$MIN",
            "mandatory": $M,
            "version": "${TAG#v}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat update-config.json

      # 6) GitHub Release 생성
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            realmatjip-universal.apk
            realmatjip-universal.apk.sha256
            update-config.json
